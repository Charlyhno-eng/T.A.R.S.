[responses.fr]
greeting = "Bonjour. Que puis-je faire pour vous ?"
wellbeing = "Je vais bien, merci de demander. Que souhaitez-vous faire ?"
identity = "Je suis T.A.R.S., votre assistant vocal local."
thanks = "Avec plaisir."
help = "Je peux répondre aux demandes simples, donner l’heure ou la date, et vous mettre en relation avec l’agent 1 ou l’agent 2."
acknowledge = "Très bien. Que souhaitez-vous faire ensuite ?"
unknown = "Je n’ai pas reconnu cette demande. Vous pouvez, par exemple, demander l’heure, dire bonjour ou contacter l’agent 1 ou l’agent 2."
time = "Il est {time}."
date = "Nous sommes le {date}."

[responses.en]
greeting = "Hello. What can I do for you?"
wellbeing = "I am doing well, thank you for asking. What would you like to do?"
identity = "I am T.A.R.S., your local voice assistant."
thanks = "You are welcome."
help = "I can handle simple requests, tell you the time or date, and connect you with Agent 1 or Agent 2."
acknowledge = "Understood. What would you like to do next?"
unknown = "I did not recognize that request. You can ask for the time, say hello, or contact Agent 1 or Agent 2."
time = "It is {time}."
date = "Today's date is {date}."

[intents.greeting]
words = ["bonjour", "bonsoir", "salut", "coucou", "hello", "hi", "hey", "greetings"]
phrases = ["bonne journee", "bonne soiree", "au revoir", "a bientot", "good morning", "good afternoon", "good evening", "goodbye", "see you later", "see you"]

[intents.wellbeing]
phrases = ["comment vas tu", "comment allez vous", "comment ca va", "ca va", "tu vas bien", "vous allez bien", "how are you", "how is it going", "are you well"]
all_words = [["how", "doing"], ["tu", "bien"], ["vous", "bien"]]

[intents.thanks]
words = ["merci", "thanks"]
stems = ["remerc", "thank", "appreciat"]

[intents.help]
words = ["aide", "help", "support"]
stems = ["aid", "assist"]
phrases = ["que peux tu faire", "que savez vous faire", "comment peux tu m aider", "comment pouvez vous m aider", "what can you do", "can you help", "help me"]

[intents.time]
words = ["heure", "horloge", "time", "clock"]
phrases = ["quelle heure est il", "quel heure est il", "quelle est l heure", "donne moi l heure", "what time is it", "do you have the time", "tell me the time"]

[intents.date]
words = ["date", "today"]
phrases = ["quel jour sommes nous", "on est quel jour", "quelle est la date", "on est quelle date", "what day is it", "what is the date", "tell me the date", "what is today s date"]

[intents.identity]
