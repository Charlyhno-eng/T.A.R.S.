[project]
name = "tars"
version = "0.1.0"
description = "A local voice assistant built with PySide6, Parakeet, and Piper TTS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.6",
    "pocket-tts",
    "piper-tts>=1.4.2,<2",
    # Later ONNX Runtime releases omit the macOS Intel wheels.
    "onnxruntime>=1.23.2,<1.24",
    "scipy",
    "huggingface_hub",
    "PyYAML",
    "nemo_toolkit[asr]",
    "python-xlib>=0.33",
    "torch",
]

[tool.uv]
package = false

# Both voice providers run on the CPU; Linux's default PyPI wheel adds
# several gigabytes of CUDA libraries that the application never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[dependency-groups]
build = [
    "pillow>=12.3.0",
    "pyinstaller>=6.16,<7",
]
