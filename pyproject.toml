[project]
name = "tars"
version = "0.1.0"
description = "A local voice assistant built with PySide6, Parakeet, and Pocket TTS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.6",
    "pocket-tts",
    "scipy",
    "huggingface_hub",
    "PyYAML",
    "nemo_toolkit[asr]",
]

[tool.uv]
package = false
